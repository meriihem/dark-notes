name: Dark Notes 2.0 — Android

on:
  workflow_dispatch:
  push:
    branches:
      - dark-notes-v2-mystical-archive
      - dark-notes-account-auth
      - dark-notes-google-auth
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-v2.yml'

permissions:
  contents: write

concurrency:
  group: dark-notes-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and commit mystical note backgrounds
        run: |
          if [ -f assets/note-backgrounds/library.jpg ] && [ -f assets/note-backgrounds/grimoire.jpg ] && [ -f assets/note-backgrounds/cathedral.jpg ] && [ -f assets/note-backgrounds/forest.jpg ] && [ -f assets/note-backgrounds/alchemy.jpg ] && [ -f assets/note-backgrounds/astral.jpg ] && [ -f assets/note-backgrounds/cemetery.jpg ] && [ -f assets/note-backgrounds/ritual.jpg ] && [ -f assets/note-backgrounds/castle.jpg ] && [ -f assets/note-backgrounds/raven.jpg ]; then
            echo "Mystical backgrounds already committed; skipping remote download."
          else
            node scripts/download-note-backgrounds.mjs
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/note-backgrounds
          if ! git diff --cached --quiet; then
            git commit -m "Add mystical note background artwork [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install dependencies
        run: npm install
      - name: Prepare web app
        run: npm run build:web
      - name: Generate Android project
        run: npx cap add android
      - name: Set increasing Android version code
        env:
          VERSION_CODE: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          version_code = int(os.environ["VERSION_CODE"]) * 100 + int(os.environ["RUN_ATTEMPT"])
          s, count = re.subn(
              r"(?m)^(\s*versionCode\s+)\d+\s*$",
              lambda m: m.group(1) + str(version_code),
              s,
              count=1
          )
          if count != 1:
              raise SystemExit("Could not set versionCode in generated android/app/build.gradle")
          s, name_count = re.subn(
              r'(?m)^(\s*versionName\s+)"[^"]*"\s*$',
              lambda m: m.group(1) + '"2.0.' + str(version_code) + '"',
              s,
              count=1
          )
          if name_count != 1:
              print("Warning: versionName was not updated; versionCode was updated.")
          p.write_text(s)
          print(f"Android versionCode set to {version_code}")
          PY
      - name: Configure Google sign-in dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/variables.gradle")
          s = p.read_text()
          if "rgcfaIncludeGoogle" not in s:
              s = s.replace("ext {", 'ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = "1.3.0"', 1)
          p.write_text(s)
          PY
      - name: Configure persistent Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "Missing GOOGLE_SERVICES_JSON_BASE64 repository secret"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/dark-notes-upload.jks
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          signing = """
              signingConfigs {
                  darkNotes {
                      storeFile file("dark-notes-upload.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" not in s:
              s, android_count = re.subn(r"android\s*\{", lambda m: m.group(0) + signing, s, count=1)
              if android_count != 1:
                  raise SystemExit("Could not insert persistent signing config into android block")
          s, debug_count = re.subn(
              r"(buildTypes\s*\{\s*debug\s*\{)",
              r"\1\n            signingConfig signingConfigs.darkNotes",
              s,
              count=1
          )
          if debug_count == 0:
              s, build_types_count = re.subn(
                  r"(buildTypes\s*\{)",
                  r"\1\n        debug { signingConfig signingConfigs.darkNotes }",
                  s,
                  count=1
              )
              if build_types_count != 1:
                  raise SystemExit("Could not configure debug signing")
          s, release_count = re.subn(
              r"(buildTypes\s*\{\s*release\s*\{)",
              r"\1\n            signingConfig signingConfigs.darkNotes",
              s,
              count=1
          )
          if release_count == 0:
              print("No release build type found; debug APK uses persistent signing.")
          if "signingConfig signingConfigs.darkNotes" not in s:
              raise SystemExit("Persistent signing config was not applied")
          p.write_text(s)
          PY
      - name: Configure immersive Android activity
        run: |
          MAIN_ACTIVITY="$(find android/app/src/main/java -name MainActivity.java -print -quit)"
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi
          cat > "$MAIN_ACTIVITY" <<'JAVA'
          package com.meriihem.darknotes;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              private void hideSystemBars() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                          View.SYSTEM_UI_FLAG_FULLSCREEN |
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      );
                  }
              }
          }
          JAVA
      - name: Generate branded Android launcher icons
        run: node scripts/generate-icons.mjs --android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Verify Firebase Android configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          clients = config.get("client", [])
          app = next((c for c in clients if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.meriihem.darknotes"), None)
          if app is None:
              raise SystemExit("google-services.json does not contain com.meriihem.darknotes")
          oauth = app.get("oauth_client", [])
          if not any(c.get("client_type") == 1 for c in oauth):
              raise SystemExit("Android OAuth client (client_type 1) is missing")
          print("Firebase package and Android OAuth client verified")
          PY
          grep -q "com.google.gms:google-services" android/build.gradle || { echo "Google Services Gradle classpath is missing"; exit 1; }
          grep -q "com.google.gms.google-services" android/app/build.gradle || { echo "Google Services app plugin is missing"; exit 1; }
      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dark-notes-2-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error